name: Type Check

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: mypy
        run: uv run mypy
