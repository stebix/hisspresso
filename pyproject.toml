[project]
name = "hisspresso"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "stebix", email = "jannik.stebani@uni-wuerzburg.de" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8",
    "plotext>=5",
    "platformdirs>=4",
]

[project.scripts]
hisspresso = "hisspresso:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8",
    "pre-commit>=4",
]

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

# ── Mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
